[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: performs live DNS, WHOIS, TLS, or reputation-provider checks",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["data", "models_saved"]

[tool.ruff.lint]
# High-signal correctness rules are enforced while legacy formatting is modernized.
select = ["E9", "F63", "F7", "F82"]
